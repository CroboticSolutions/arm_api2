manipulator:
  # TRAC-IK Speed (brain experiments/2026-10-16_crx10ia_l_ik_kdl_vs_tracik): 100 % /
  # 0.4 ms vs KDL 98.6 % / 7.2 ms. Without solve_type the plugin runs Distance and
  # always spends the whole timeout. It can return +-2pi joint wraps on Cartesian
  # paths; arm_api2 and hand_teleop reject them (max_joint_step_rad).
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  solve_type: Speed
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
