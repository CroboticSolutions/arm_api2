# arm_api2 + FANUC CRX-10iA/L physical over ros2_fanuc_interface (Jazzy host):
#   ros2 launch fanuc_control robot_bringup.launch.py robot_type:=crx10ia_l robot_ip:=<ip>
#
# crx_description's crx10ia_l URDF: root base_link, tcp at the flange (no torch or
# camera geometry, no world link), so plan in base_link to tcp. The welding cell
# (table, pedestal, positioner; crx10ia_l_cell.xacro, xacro arg cell:=true) hangs
# below base_link as static collision geometry.
# Lower default velocity for first site bring-up.
#
# Launch with: robot_name:=crx10ia_l config_profile:=real use_sim_time:=false
robot:
  arm_name: manipulator
  ee_link_name: tcp
  robot_desc: robot_description
  move_group_ns: ""
  planning_scene: planning_scene
  planning_frame: base_link
  num_cart_pts: 20
  # reject Cartesian paths with a joint change > this between points (IK flip / 2pi wrap)
  max_joint_step_rad: 0.5
  joint_states: joint_states
  max_vel_scaling_factor: 0.05
  max_acc_scaling_factor: 0.05
  with_planner: true
topic:
  sub:
    cmd_pose:
      name: arm/cmd/pose
      queue: 1
    cmd_traj:
      name: arm/cmd/traj
      queue: 1
    cmd_tool_orientation:
      name: tool/cmd/orient
      queue: 1
    cmd_delta_pose:
      name: arm/cmd/delta_pose
      queue: 1
    joint_states:
      name: joint_states
      queue: 1
  pub:
    display_trajectory:
      name: arm/display_path
      queue: 1
    current_pose:
      name: arm/state/current_pose
      queue: 1
    current_robot_state:
      name: arm/state/ctl_state
      queue: 1
    gripper_state:
      name: arm/state/gripper_state
      queue: 1
srv:
  disable_collision:
    name: /move_group/disable_collision
  add_collision:
    name: /move_group/add_collision
  change_robot_state:
    name: arm/change_state
  set_vel_acc:
    name: arm/set_vel_acc
  set_planner:
    name: arm/set_planner
  set_eelink:
    name: arm/set_eelink
  set_planonly:
    name: arm/set_planonly
  open_gripper:
    name: arm/open_gripper
  close_gripper:
    name: arm/close_gripper
action:
  move_to_pose:
    name: arm/move_to_pose
  move_to_joint:
    name: arm/move_to_joint
  move_to_pose_path:
    name: arm/move_to_pose_path
  gripper_control:
    name: arm/gripper_control
