robot: 
  arm_name: manipulator  
  ee_link_name: wrist_2_link
  robot_desc: robot_description
  move_group_ns: ""
  planning_frame: base
  joint_states: joint_states
  max_vel_scaling_factor: 0.3
  max_acc_scaling_factor: 0.3
  enable_servo: true
topic:
  sub:
    cmd_pose:
      name: arm/cmd/pose
      queue: 1
    cmd_traj:
      name: arm/cmd/traj
      queue: 1
    joint_states:
      name: joint_states
      queue: 1
  pub:
    current_pose:
      name: arm/state/current_pose
      queue: 1
    current_robot_state:
      name: arm/state/ctl_state
      queue: 1
srv:
  change_robot_state:
    name: arm/change_state
  set_vel_acc:
    name: arm/set_vel_acc
  set_planner:
    name: arm/set_planner
  set_eelink:
    name: arm/set_eelink
  set_planonly:
    name: arm/set_planonly
  open_gripper: 
    name: arm/open_gripper
  close_gripper:
    name: arm/close_gripper
action:
  move_to_pose:
    name: arm/move_to_pose
  move_to_joint:
    name: arm/move_to_joint
  move_to_pose_path:
    name: arm/move_to_pose_path
  gripper_control:
    name: arm/gripper_control
