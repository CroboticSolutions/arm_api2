# arm_api2 + FANUC CRX-10iA physical (ROBO WH-PP W500 torch, RealSense D435).
#
# Same MoveIt semantics as crx10ia_sim.yaml (group manipulator, ee welding_tcp,
# planning_frame world). Lower default velocity for first site bring-up.
#
# Launch with: config_profile:=real use_sim_time:=false
robot:
  arm_name: manipulator
  ee_link_name: welding_tcp
  robot_desc: robot_description
  move_group_ns: ""
  planning_scene: planning_scene
  planning_frame: world
  num_cart_pts: 20
  joint_states: joint_states
  max_vel_scaling_factor: 0.05
  max_acc_scaling_factor: 0.05
  with_planner: true
topic:
  sub:
    cmd_pose:
      name: arm/cmd/pose
      queue: 1
    cmd_traj:
      name: arm/cmd/traj
      queue: 1
    cmd_tool_orientation:
      name: tool/cmd/orient
      queue: 1
    cmd_delta_pose:
      name: arm/cmd/delta_pose
      queue: 1
    joint_states:
      name: joint_states
      queue: 1
  pub:
    display_trajectory:
      name: arm/display_path
      queue: 1
    current_pose:
      name: arm/state/current_pose
      queue: 1
    current_robot_state:
      name: arm/state/ctl_state
      queue: 1
    gripper_state:
      name: arm/state/gripper_state
      queue: 1
srv:
  disable_collision:
    name: /move_group/disable_collision
  add_collision:
    name: /move_group/add_collision
  change_robot_state:
    name: arm/change_state
  set_vel_acc:
    name: arm/set_vel_acc
  set_planner:
    name: arm/set_planner
  set_eelink:
    name: arm/set_eelink
  set_planonly:
    name: arm/set_planonly
  open_gripper:
    name: arm/open_gripper
  close_gripper:
    name: arm/close_gripper
action:
  move_to_pose:
    name: arm/move_to_pose
  move_to_joint:
    name: arm/move_to_joint
  move_to_pose_path:
    name: arm/move_to_pose_path
  gripper_control:
    name: arm/gripper_control
